name: CI

# triggers pipeline when push is made to any branch (typical CI pipeline rule)
on: [push]

jobs:
  sast_scan:
    name: Run Bandit Scan
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Bandit
      run: pip install bandit

    - name: Run Bandit Scan
      # save report in json format
      run: bandit -ll -ii -r . -f json -o bandit-report.json

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      if: always()
      # execute this step no matter of previous status
      with:
        # how artifacts will be named when exported
        name: bandit-findings
        path: bandit-report.json

  image_scan:
    # each new job runs in a new isolated environment
    name: Build and Run Image Scan
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build Docker Image
      run: docker build -f Dockerfile -t mytestapp:latest .

    - name: Docker Scout Scan
      uses: docker/scout-action@v1.15.1
      with:
        dockerhub-user: ${{ secrets.DOCKERHUB_USERNAME }}
        dockerhub-password: ${{ secrets.DOCKERHUB_PASSWORD }}
        command: quickview,cves
        only-severities: critical,high
        sarif-file: scout-report.sarif
        # exit code by default is true which means 0, add true to produce non success
        exit-code: true

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: docker-scout-findings
        path: scout-report.sarif

  dast_scan:
    name: Deploy PyGoat and run ZAP
    runs-on: ubuntu-latest

    steps:
      - name: Pull PyGoat
        run: docker pull pygoat/pygoat:latest

      - name: Start PyGoat
        run: docker run --rm -d --name pygoat -p 8000:8000 pygoat/pygoat:latest

      - name: Wait for PyGoat
        run: |
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8000/ >/dev/null; then
              echo "PyGoat is ready"
              exit 0
            fi
            sleep 2
          done
          docker logs pygoat
          exit 1

      - name: Set target address for ZAP
        run: |
          TARGET_IP=$(ip -f inet -o addr show docker0 | awk '{print $4}' | cut -d '/' -f 1)
          echo "ZAP_TARGET=http://${TARGET_IP}:8000" >> "$GITHUB_ENV"

      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: ${{ env.ZAP_TARGET }}
          allow_issue_writing: false
          fail_action: false
          artifact_name: zap_scan

      - name: Stop PyGoat
        if: always()
        run: docker rm -f pygoat || true
